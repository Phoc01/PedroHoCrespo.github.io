<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">Atlas Bull: da missão à entrega</title><desc id="desc">Ilustração do fluxo: entender a tarefa, criar com agentes, revisar com pessoas e entregar.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E6E0D8" stroke-opacity=".055"/></pattern></defs>
<rect width="960" height="660" rx="20" fill="#022843"/><rect width="960" height="660" fill="url(#grid)"/>
<g fill="none" stroke="#009B79" stroke-width="3"><path d="M250 218H690V468H250V218"/><path d="m672 208 18 10-18 10M700 450l-10 18-10-18M268 478l-18-10 18-10"/></g>
<g font-family="Arial,sans-serif"><text x="56" y="70" fill="#E6E0D8" font-size="20" font-weight="700" letter-spacing="4">ATLAS BULL</text><text x="56" y="106" fill="#9CC9C1" font-size="16">Um processo claro. Uma entrega útil.</text>
<g transform="translate(90 150)"><rect width="310" height="145" rx="12" fill="#E6E0D8"/><text x="24" y="36" fill="#009B79" font-size="15" font-weight="700">01 / MISSÃO</text><text x="24" y="73" fill="#022843" font-size="25" font-weight="700">Entender a tarefa</text><text x="24" y="111" fill="#465967" font-size="16">Entradas, objetivo e critérios.</text></g>
<g transform="translate(560 150)"><rect width="310" height="145" rx="12" fill="#009B79"/><text x="24" y="36" fill="#E6E0D8" font-size="15" font-weight="700">02 / AGENTES</text><text x="24" y="73" fill="#022843" font-size="25" font-weight="700">Organizar e produzir</text><text x="24" y="111" fill="#022843" font-size="16">Trabalho com contexto e escopo.</text></g>
<g transform="translate(560 400)"><rect width="310" height="145" rx="12" fill="#E6E0D8"/><text x="24" y="36" fill="#009B79" font-size="15" font-weight="700">03 / REVISÃO</text><text x="24" y="73" fill="#022843" font-size="25" font-weight="700">Conferir com pessoas</text><text x="24" y="111" fill="#465967" font-size="16">Decisões e aprovação humana.</text></g>
<g transform="translate(90 400)"><rect width="310" height="145" rx="12" fill="#E6E0D8"/><text x="24" y="36" fill="#009B79" font-size="15" font-weight="700">04 / ENTREGA</text><text x="24" y="73" fill="#022843" font-size="25" font-weight="700">Usar e acompanhar</text><text x="24" y="111" fill="#465967" font-size="16">Resultado dentro do combinado.</text></g>
<text x="56" y="610" fill="#9CC9C1" font-size="14">Visão ilustrativa do fluxo · sem conexão a dados ao vivo</text></g></svg>
